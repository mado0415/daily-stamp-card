<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4ea8de">
  <title>表題曲 DAILY STAMP</title>
  <style>
    :root {
      --theme: #4ea8de;
      --theme-rgb: 78, 168, 222;
      --theme-text: #ffffff;
      --ink: #24364a;
      --muted: #718096;
      --line: #dce7f0;
      --paper: #ffffff;
      --wash: #f2f7fb;
      --shadow: 0 18px 48px rgba(48, 83, 112, .13);
    }

    * { box-sizing: border-box; }
    html { background: #eaf2f8; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(var(--theme-rgb), .16), transparent 36%),
        radial-gradient(circle at 95% 15%, rgba(var(--theme-rgb), .10), transparent 30%),
        #eaf2f8;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(100%, 690px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 14px max(30px, env(safe-area-inset-bottom));
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 12px;
      color: #5e7690;
      font-size: 12px;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .mode-link {
      border: 0;
      padding: 5px 0;
      color: inherit;
      background: transparent;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(var(--theme-rgb), .22);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: var(--theme);
    }

    .hero {
      padding: 31px 24px 18px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--theme);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.3;
      letter-spacing: .02em;
      word-break: break-word;
    }

    .release-line {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .release-line strong { color: var(--ink); }

    .progress-area {
      padding: 0 24px 20px;
    }

    .progress-copy {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .progress-copy strong {
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    .progress-copy span {
      color: var(--muted);
      font-size: 13px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      background: #eaf0f5;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--theme);
      border-radius: inherit;
      transition: width .35s ease;
    }

    .milestone-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 24px 22px;
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .15s ease, opacity .15s ease;
    }

    .btn:active { transform: scale(.98); }
    .btn-primary { color: var(--theme-text); background: var(--theme); }
    .btn-soft { color: var(--ink); background: rgba(var(--theme-rgb), .12); }
    .btn-plain { color: #4e6479; background: #edf3f7; }
    .btn[disabled] { opacity: .46; transform: none; }
    .btn-full { width: 100%; }

    .card-divider {
      height: 1px;
      margin: 0 24px;
      background: var(--line);
    }

    .stamp-section { padding: 22px 18px 25px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 5px 13px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .day {
      position: relative;
      aspect-ratio: 1 / 1.13;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: #52677b;
      background: #f9fbfd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px;
    }

    button.day { cursor: pointer; }
    .day.today {
      border: 2px solid var(--theme);
      background: rgba(var(--theme-rgb), .07);
    }

    .day.stamped {
      border-color: transparent;
      color: var(--theme-text);
      background: var(--theme);
      box-shadow: 0 7px 14px rgba(var(--theme-rgb), .22);
    }

    .day.future { opacity: .55; }
    .day.prejoin {
      opacity: .34;
      background: #edf2f6;
    }
    .day.prejoin .day-stamp { display: none; }
    .day-state {
      height: 29px;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .day-date { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .day-week { font-size: 10px; font-weight: 700; }
    .day-stamp {
      height: 29px;
      display: grid;
      place-items: center;
      font-size: 24px;
      line-height: 1;
      filter: grayscale(1);
      opacity: .10;
      transform: rotate(-8deg) scale(.8);
    }

    .stamped .day-stamp {
      filter: none;
      opacity: 1;
      transform: rotate(-8deg) scale(1);
    }

    .today-tag {
      position: absolute;
      top: 3px;
      right: 4px;
      font-size: 8px;
      font-weight: 900;
      color: var(--theme);
    }

    .stamped .today-tag { color: var(--theme-text); }

    .helper {
      margin: 14px 5px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .share-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 24px 25px;
    }

    .completion {
      display: none;
      margin: 0 24px 22px;
      padding: 15px;
      color: var(--ink);
      background: rgba(var(--theme-rgb), .12);
      border-radius: 16px;
      text-align: center;
      font-weight: 800;
      line-height: 1.6;
    }

    .completion.show { display: block; }

    .stage-decoration {
      min-height: 28px;
      margin: -5px 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      color: var(--theme);
      font-size: 20px;
      letter-spacing: .16em;
      opacity: .24;
      transition: opacity .3s ease, transform .3s ease;
    }

    .card[data-stage="1"] .stage-decoration { opacity: .45; }
    .card[data-stage="2"] .stage-decoration { opacity: .65; transform: scale(1.03); }
    .card[data-stage="3"] .stage-decoration { opacity: .82; transform: scale(1.06); }
    .card[data-stage="4"] .stage-decoration { opacity: 1; transform: scale(1.1); }

    .card.template-hotel {
      --paper: #fffaf0;
      --ink: #293b45;
      --muted: #7a6b58;
      --line: #e7d8be;
      --wash: #faf1df;
    }

    .template-hotel .hero {
      color: #fffaf0;
      background:
        linear-gradient(135deg, rgba(18, 42, 52, .96), rgba(35, 68, 74, .94)),
        radial-gradient(circle at 30% 20%, rgba(var(--theme-rgb), .25), transparent 36%);
    }

    .template-hotel .eyebrow,
    .template-hotel .release-line,
    .template-hotel .release-line strong { color: #f8e7bd; }
    .template-hotel .stamp-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .template-hotel .day {
      aspect-ratio: .86 / 1;
      border-radius: 7px 7px 14px 14px;
      color: #e8dcc6;
      background: #294852;
      border-color: #46646a;
      box-shadow: inset 0 5px 0 rgba(255,255,255,.04);
    }
    .template-hotel .day.stamped {
      color: #2a3540;
      background: #ffe6a3;
      box-shadow: 0 0 20px rgba(255, 202, 92, .45);
    }
    .template-hotel .day.prejoin { color: #8f9694; background: #dfe3df; border-color: #d2d7d3; }
    .template-hotel .day.future { opacity: .68; }
    .template-hotel .stamp-section { background: #f7eedc; }

    .card.template-journey { --paper: #fffdf8; }
    .template-journey .stamp-grid {
      position: relative;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px 11px;
    }
    .template-journey .stamp-grid::before {
      content: "";
      position: absolute;
      inset: 50% 5%;
      height: 3px;
      background: repeating-linear-gradient(90deg, rgba(var(--theme-rgb), .28) 0 10px, transparent 10px 17px);
      transform: translateY(-50%);
    }
    .template-journey .day {
      aspect-ratio: 1;
      z-index: 1;
      border-radius: 50%;
      background: #fffdf8;
      border: 2px solid rgba(var(--theme-rgb), .3);
    }
    .template-journey .day.stamped { border-color: var(--theme); }
    .template-journey .today-tag { top: -1px; right: 50%; transform: translateX(50%); }

    .listen-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 0 24px 10px;
    }

    .listen-links .btn { min-height: 43px; font-size: 13px; }

    .test-panel {
      margin: 0 0 12px;
      padding: 15px;
      color: #31495f;
      background: rgba(255, 255, 255, .95);
      border: 1px solid rgba(var(--theme-rgb), .28);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(48, 83, 112, .10);
    }

    .test-panel h2 { margin: 0; font-size: 15px; }
    .test-panel p { margin: 5px 0 12px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .test-controls { display: grid; grid-template-columns: 1.15fr .8fr 1.25fr auto; gap: 8px; align-items: end; }
    .test-field label { display: block; margin: 0 0 4px; font-size: 11px; font-weight: 800; }
    .test-field input, .test-field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cddae5;
      border-radius: 10px;
      padding: 8px 9px;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
    }

    .admin-card { padding: 29px 22px 24px; }
    .admin-card h1 { font-size: 27px; }
    .admin-lead {
      margin: 9px 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 12px;
    }

    .field { min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field label {
      display: block;
      margin: 0 0 6px;
      color: #52677b;
      font-size: 12px;
      font-weight: 800;
    }

    .field input, .field select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #cddae5;
      border-radius: 12px;
      padding: 10px 11px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
      font-size: 16px;
    }

    .field input:focus, .field select:focus {
      border-color: var(--theme);
      box-shadow: 0 0 0 3px rgba(var(--theme-rgb), .15);
    }

    .color-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding-top: 2px;
    }

    .color-choice {
      width: 36px;
      height: 36px;
      border: 3px solid transparent;
      border-radius: 50%;
      background: var(--dot);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.10);
    }

    .color-choice.selected {
      border-color: #ffffff;
      outline: 3px solid var(--dot);
    }

    .admin-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .url-box {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background: var(--wash);
      border-radius: 16px;
    }

    .url-box.show { display: block; }
    .url-box label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 800; }
    .url-copy-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .url-copy-row input {
      width: 100%;
      min-width: 0;
      border: 1px solid #cddae5;
      border-radius: 10px;
      padding: 10px;
      color: #52677b;
      background: #fff;
      font-size: 13px;
    }

    .notice, .error {
      margin: 12px 0 0;
      font-size: 12px;
      line-height: 1.65;
    }

    .notice { color: var(--muted); }
    .error { display: none; color: #c0392b; font-weight: 800; }
    .error.show { display: block; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(25, 42, 57, .55);
      backdrop-filter: blur(5px);
    }

    .modal.show { display: grid; }
    .modal-box {
      width: min(100%, 480px);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 22px 60px rgba(0,0,0,.25);
    }

    .modal-box h2 { margin: 2px 0 13px; font-size: 18px; }
    .modal-box img { display: block; width: 100%; border-radius: 15px; background: #eef4f8; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      padding: 10px 15px;
      color: #fff;
      background: rgba(29, 47, 63, .92);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .confetti-piece {
      position: fixed;
      z-index: 40;
      top: -18px;
      width: 9px;
      height: 15px;
      background: var(--c);
      animation: fall var(--d) linear forwards;
      transform: rotate(var(--r));
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translate3d(var(--x), 110vh, 0) rotate(700deg); }
    }

    .hidden { display: none !important; }

    @media (max-width: 500px) {
      .shell {
        padding-top: calc(max(18px, env(safe-area-inset-top)) + 28px);
        padding-left: 10px;
        padding-right: 10px;
      }
      .card { border-radius: 22px; }
      .hero { padding-left: 17px; padding-right: 17px; }
      .progress-area, .action-row, .share-row, .listen-links { padding-left: 17px; padding-right: 17px; }
      .card-divider { margin-left: 17px; margin-right: 17px; }
      .stamp-section { padding-left: 12px; padding-right: 12px; }
      .stamp-grid { gap: 6px; }
      .day { border-radius: 12px; }
      .day-date { font-size: 12px; }
      .day-stamp { font-size: 22px; height: 26px; }
      .form-grid { grid-template-columns: 1fr; }
      .test-controls { grid-template-columns: 1fr 1fr; }
      .field.wide { grid-column: auto; }
      .admin-card { padding-left: 17px; padding-right: 17px; }
    }

    @media (max-width: 355px) {
      .stamp-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .action-row, .share-row, .admin-actions, .modal-actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <span>SNOW MAN SUPPORT TOOL</span>
      <button id="modeLink" class="mode-link" type="button"></button>
    </div>

    <section id="testPanel" class="test-panel hidden" aria-label="テスト操作">
      <h2>🧪 TEST MODE</h2>
      <p>本番の記録には影響しません。「スタンプ数」を3・5・10などに変えると、節目の演出を確認できます。</p>
      <div class="test-controls">
        <div class="test-field">
          <label for="testDate">仮の「今日」</label>
          <input id="testDate" type="date">
        </div>
        <div class="test-field">
          <label for="testCount">スタンプ数</label>
          <select id="testCount"></select>
        </div>
        <div class="test-field">
          <label for="testTemplate">テンプレート</label>
          <select id="testTemplate">
            <option value="hotel">🏨 HOTEL</option>
            <option value="classic">◯ STAMP</option>
            <option value="journey">🚏 JOURNEY</option>
          </select>
        </div>
        <button id="testReset" class="btn btn-plain" type="button">リセット</button>
      </div>
    </section>

    <section id="participantView" class="card hidden" aria-label="表題曲デイリースタンプカード">
      <header class="hero">
        <p id="templateLabel" class="eyebrow">DAILY LISTENING STAMP</p>
        <h1 id="campaignTitle"></h1>
        <p class="release-line"><strong id="releaseDateText"></strong> CD RELEASE</p>
      </header>

      <div class="progress-area">
        <div class="progress-copy">
          <strong id="progressCount">0 STAMPS</strong>
          <span id="daysLeftText"></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="次のマイルストーンまでの進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="milestoneNote" class="milestone-note"></p>
      </div>

      <div id="listenLinks" class="listen-links"></div>
      <div class="action-row">
        <button id="todayButton" class="btn btn-soft" type="button">スタンプを押す</button>
        <button id="imageButtonTop" class="btn btn-plain" type="button">記録を画像にする</button>
      </div>

      <div id="stageDecoration" class="stage-decoration" aria-hidden="true">✦　✦　✦</div>
      <div id="completion" class="completion"></div>
      <div class="card-divider"></div>

      <section class="stamp-section">
        <div class="section-head">
          <h2>LISTENING CARD</h2>
          <span id="periodText"></span>
        </div>
        <div id="stampGrid" class="stamp-grid"></div>
        <p id="helperText" class="helper"></p>
      </section>

      <div class="share-row">
        <button id="imageButton" class="btn btn-plain" type="button">画像を作る</button>
        <button id="xButton" class="btn btn-plain" type="button">Xで報告する</button>
      </div>
    </section>

    <section id="adminView" class="card admin-card hidden" aria-label="スタンプカード管理設定">
      <p class="eyebrow">CARD SETUP</p>
      <h1>スタンプカードを作る</h1>
      <p class="admin-lead">曲名・期間・再生先を設定して、参加者に配る専用URLを作成します。発売日のマスも自動で含まれます。</p>

      <div class="form-grid">
        <div class="field wide">
          <label for="adminTitle">表題曲名／カードタイトル</label>
          <input id="adminTitle" type="text" maxlength="60" placeholder="例：○○○ DAILY STAMP">
        </div>
        <div class="field">
          <label for="adminStart">開始日</label>
          <input id="adminStart" type="date">
        </div>
        <div class="field">
          <label for="adminRelease">CD発売日（この日を含む）</label>
          <input id="adminRelease" type="date">
        </div>
        <div class="field wide">
          <label for="adminLink">共通の再生ページURL（任意）</label>
          <input id="adminLink" type="url" inputmode="url" placeholder="公式スマートリンクなど https://...">
        </div>
        <div class="field">
          <label for="adminApple">Apple Music（任意）</label>
          <input id="adminApple" type="url" inputmode="url" placeholder="https://music.apple.com/..."></div>
        <div class="field">
          <label for="adminSpotify">Spotify（任意）</label>
          <input id="adminSpotify" type="url" inputmode="url" placeholder="https://open.spotify.com/..."></div>
        <div class="field">
          <label for="adminLine">LINE MUSIC（任意）</label>
          <input id="adminLine" type="url" inputmode="url" placeholder="https://music.line.me/..."></div>
        <div class="field">
          <label for="adminYoutube">YouTube（任意）</label>
          <input id="adminYoutube" type="url" inputmode="url" placeholder="https://youtu.be/..."></div>
        <div class="field">
          <label for="adminTemplate">カードテンプレート</label>
          <select id="adminTemplate">
            <option value="hotel">🏨 HOTEL｜ホテル</option>
            <option value="classic">◯ STAMP｜ポイントカード</option>
            <option value="journey">🚏 JOURNEY｜発売日への道</option>
          </select>
        </div>
        <div class="field">
          <label for="adminStamp">スタンプの絵柄</label>
          <select id="adminStamp">
            <option value="⛄️">⛄️ 雪だるま</option>
            <option value="🎵">🎵 音符</option>
            <option value="💿">💿 CD</option>
            <option value="⭐️">⭐️ 星</option>
            <option value="💙">💙 ハート</option>
          </select>
        </div>
        <div class="field">
          <label>カードカラー</label>
          <div id="colorList" class="color-list" role="group" aria-label="カードカラー"></div>
        </div>
      </div>

      <p id="adminError" class="error" role="alert"></p>
      <div class="admin-actions">
        <button id="previewButton" class="btn btn-soft" type="button">この設定で確認</button>
        <button id="generateButton" class="btn btn-primary" type="button">参加者用URLを作る</button>
        <button id="testGenerateButton" class="btn btn-plain" type="button">テスト用URLを作る</button>
      </div>

      <div id="urlBox" class="url-box">
        <label id="generatedUrlLabel" for="generatedUrl">参加者へ共有するURL</label>
        <div class="url-copy-row">
          <input id="generatedUrl" type="text" readonly>
          <button id="copyButton" class="btn btn-primary" type="button">コピー</button>
        </div>
        <p class="notice">参加者用URLは配布用、テストURLは管理者の確認用です。テスト記録は本番のスタンプと分けて保存されます。</p>
      </div>
    </section>
  </main>

  <div id="shareModal" class="modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <h2 id="shareTitle">スタンプカード画像</h2>
      <img id="shareImage" alt="スタンプカードの共有画像">
      <div class="modal-actions">
        <button id="nativeShareButton" class="btn btn-primary" type="button">画像を共有</button>
        <button id="saveImageButton" class="btn btn-soft" type="button">画像を保存</button>
        <button id="closeModalButton" class="btn btn-plain btn-full" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const COLORS = [
        '#ffcc33', '#7b2cbf', '#f8f9fa', '#4ea8de', '#f97316',
        '#2a9d8f', '#283044', '#e63946', '#ff69b4'
      ];
      const STAMPS = ['⛄️', '🎵', '💿', '⭐️', '💙'];
      const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
      const params = new URLSearchParams(location.search);
      const isTestMode = params.get('test') === '1';
      const incomingTestDate = params.get('today') || '';
      let simulatedToday = /^\d{4}-\d{2}-\d{2}$/.test(incomingTestDate) ? incomingTestDate : '2026-10-07';
      let selectedColor = '#4ea8de';
      let currentConfig = null;
      let shareBlob = null;
      let toastTimer = null;

      const $ = (id) => document.getElementById(id);

      function parseLocalDate(value) {
        const [y, m, d] = value.split('-').map(Number);
        return new Date(y, m - 1, d, 12, 0, 0, 0);
      }

      function isoLocal(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function currentDay() {
        return isTestMode ? simulatedToday : isoLocal();
      }

      function addDays(value, amount) {
        const date = parseLocalDate(value);
        date.setDate(date.getDate() + amount);
        return isoLocal(date);
      }

      function dateRange(start, end) {
        const days = [];
        let cursor = start;
        let guard = 0;
        while (cursor <= end && guard < 370) {
          days.push(cursor);
          cursor = addDays(cursor, 1);
          guard += 1;
        }
        return days;
      }

      function formatDate(value, withYear = true) {
        const date = parseLocalDate(value);
        return withYear
          ? `${date.getFullYear()}.${date.getMonth() + 1}.${date.getDate()}`
          : `${date.getMonth() + 1}/${date.getDate()}`;
      }

      function colorRgb(hex) {
        const value = hex.replace('#', '');
        return [0, 2, 4].map((i) => parseInt(value.slice(i, i + 2), 16));
      }

      function contrastText(hex) {
        const [r, g, b] = colorRgb(hex);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
        return luminance > 178 ? '#24364a' : '#ffffff';
      }

      function applyTheme(hex) {
        if (!/^#[0-9a-f]{6}$/i.test(hex)) hex = '#4ea8de';
        const [r, g, b] = colorRgb(hex);
        document.documentElement.style.setProperty('--theme', hex);
        document.documentElement.style.setProperty('--theme-rgb', `${r}, ${g}, ${b}`);
        document.documentElement.style.setProperty('--theme-text', contrastText(hex));
        document.querySelector('meta[name="theme-color"]').setAttribute('content', hex);
      }

      function hashText(text) {
        let hash = 2166136261;
        for (let i = 0; i < text.length; i += 1) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      function safeUrl(value) {
        if (!value) return '';
        try {
          const url = new URL(value);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch (_) {
          return '';
        }
      }

      function configFromParams(source = params) {
        const title = (source.get('title') || '').trim();
        const start = source.get('start') || '';
        const release = source.get('release') || '';
        const incomingStamp = source.get('stamp') || '⛄️';
        const stamp = STAMPS.includes(incomingStamp) ? incomingStamp : '⛄️';
        const color = /^#[0-9a-f]{6}$/i.test(source.get('color') || '') ? source.get('color') : '#4ea8de';
        const link = safeUrl(source.get('link') || '');
        const apple = safeUrl(source.get('apple') || '');
        const spotify = safeUrl(source.get('spotify') || '');
        const line = safeUrl(source.get('line') || '');
        const youtube = safeUrl(source.get('youtube') || '');
        const template = ['classic', 'hotel', 'journey'].includes(source.get('template')) ? source.get('template') : 'hotel';
        const seed = `${title}|${start}|${release}`;
        const id = (source.get('cid') || hashText(seed)).replace(/[^a-z0-9_-]/gi, '').slice(0, 48);
        if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(start) || !/^\d{4}-\d{2}-\d{2}$/.test(release) || release < start) return null;
        return { title, start, release, stamp, color, link, apple, spotify, line, youtube, template, id };
      }

      function configFromForm() {
        const title = $('adminTitle').value.trim();
        const start = $('adminStart').value;
        const release = $('adminRelease').value;
        const rawLink = $('adminLink').value.trim();
        const link = safeUrl(rawLink);
        const rawApple = $('adminApple').value.trim();
        const rawSpotify = $('adminSpotify').value.trim();
        const rawLine = $('adminLine').value.trim();
        const rawYoutube = $('adminYoutube').value.trim();
        const apple = safeUrl(rawApple);
        const spotify = safeUrl(rawSpotify);
        const line = safeUrl(rawLine);
        const youtube = safeUrl(rawYoutube);
        const template = $('adminTemplate').value;
        const stamp = $('adminStamp').value;
        const color = selectedColor;
        let error = '';
        if (!title) error = '表題曲名／カードタイトルを入力してください。';
        else if (!start || !release) error = '開始日とCD発売日を入力してください。';
        else if (release < start) error = 'CD発売日は開始日以降にしてください。';
        else if (dateRange(start, release).length > 366) error = '期間は366日以内にしてください。';
        else if ([rawLink && !link, rawApple && !apple, rawSpotify && !spotify, rawLine && !line, rawYoutube && !youtube].some(Boolean)) error = '再生先は http:// または https:// で始まるURLにしてください。';
        showError(error);
        if (error) return null;
        const id = currentConfig && currentConfig.title === title && currentConfig.start === start && currentConfig.release === release
          ? currentConfig.id
          : hashText(`${title}|${start}|${release}`);
        return { title, start, release, stamp, color, link, apple, spotify, line, youtube, template, id };
      }

      function configUrl(config, testMode = false) {
        const url = new URL(location.href);
        url.search = '';
        url.hash = '';
        url.searchParams.set('title', config.title);
        url.searchParams.set('start', config.start);
        url.searchParams.set('release', config.release);
        if (config.link) url.searchParams.set('link', config.link);
        if (config.apple) url.searchParams.set('apple', config.apple);
        if (config.spotify) url.searchParams.set('spotify', config.spotify);
        if (config.line) url.searchParams.set('line', config.line);
        if (config.youtube) url.searchParams.set('youtube', config.youtube);
        url.searchParams.set('stamp', config.stamp);
        url.searchParams.set('color', config.color);
        url.searchParams.set('template', config.template);
        url.searchParams.set('cid', config.id);
        if (testMode) url.searchParams.set('test', '1');
        return url.href;
      }

      function storageKey(config) {
        return `${isTestMode ? 'daily_stamp_test_' : 'daily_stamp_'}${config.id}`;
      }

      function loadStamps(config) {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey(config)) || '[]');
          return Array.isArray(saved) ? new Set(saved.filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d))) : new Set();
        } catch (_) {
          return new Set();
        }
      }

      function saveStamps(config, stamps) {
        localStorage.setItem(storageKey(config), JSON.stringify([...stamps].sort()));
      }

      function metaKey(config) {
        return `${isTestMode ? 'daily_stamp_test_meta_' : 'daily_stamp_meta_'}${config.id}`;
      }

      function loadMeta(config) {
        const today = currentDay();
        let meta = null;
        try { meta = JSON.parse(localStorage.getItem(metaKey(config)) || 'null'); } catch (_) { meta = null; }
        if (!meta || !/^\d{4}-\d{2}-\d{2}$/.test(meta.joinedOn || '')) {
          const joinedOn = today < config.start ? config.start : (today > config.release ? config.release : today);
          meta = { joinedOn };
          localStorage.setItem(metaKey(config), JSON.stringify(meta));
        }
        return meta;
      }

      function milestoneState(count, total) {
        const marks = [...new Set([3, 5, 10, 15, 20, total])].filter((value) => value > 0 && value <= total).sort((a, b) => a - b);
        const next = marks.find((value) => value > count) || total;
        const previous = [...marks].reverse().find((value) => value <= count) || 0;
        const span = Math.max(1, next - previous);
        const progress = count >= total ? 100 : Math.round(((count - previous) / span) * 100);
        const stage = count >= total ? 4 : count >= 10 ? 3 : count >= 5 ? 2 : count >= 3 ? 1 : 0;
        return { next, previous, progress, stage };
      }

      function showError(message) {
        $('adminError').textContent = message;
        $('adminError').classList.toggle('show', Boolean(message));
      }

      function toast(message) {
        clearTimeout(toastTimer);
        $('toast').textContent = message;
        $('toast').classList.add('show');
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1900);
      }

      function renderColorChoices() {
        const list = $('colorList');
        list.innerHTML = '';
        COLORS.forEach((color) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'color-choice';
          button.style.setProperty('--dot', color);
          button.setAttribute('aria-label', `カラー ${color}`);
          button.addEventListener('click', () => {
            selectedColor = color;
            applyTheme(color);
            [...list.children].forEach((item) => item.classList.toggle('selected', item === button));
          });
          list.appendChild(button);
        });
        list.children[3].classList.add('selected');
      }

      function initAdminDefaults() {
        const today = isoLocal();
        $('adminStart').value = params.get('start') || today;
        $('adminRelease').value = params.get('release') || addDays(today, 13);
        $('adminTitle').value = params.get('title') || '';
        $('adminLink').value = params.get('link') || '';
        $('adminApple').value = params.get('apple') || '';
        $('adminSpotify').value = params.get('spotify') || '';
        $('adminLine').value = params.get('line') || '';
        $('adminYoutube').value = params.get('youtube') || '';
        $('adminTemplate').value = ['classic', 'hotel', 'journey'].includes(params.get('template')) ? params.get('template') : 'hotel';
        $('adminStamp').value = params.get('stamp') || '⛄️';
        const incoming = params.get('color');
        if (incoming && COLORS.includes(incoming)) {
          selectedColor = incoming;
          [...$('colorList').children].forEach((item, index) => item.classList.toggle('selected', COLORS[index] === incoming));
          applyTheme(incoming);
        }
      }

      function showAdmin() {
        $('testPanel').classList.add('hidden');
        $('participantView').classList.add('hidden');
        $('adminView').classList.remove('hidden');
        $('modeLink').textContent = currentConfig ? 'カードに戻る' : '';
        $('modeLink').onclick = currentConfig ? () => showParticipant(currentConfig) : null;
      }

      function showParticipant(config) {
        currentConfig = config;
        applyTheme(config.color);
        $('participantView').classList.remove('template-classic', 'template-hotel', 'template-journey');
        $('participantView').classList.add(`template-${config.template}`);
        $('adminView').classList.add('hidden');
        $('participantView').classList.remove('hidden');
        setupTestPanel(config);
        $('modeLink').textContent = '管理用設定';
        $('modeLink').onclick = () => {
          fillForm(config);
          showAdmin();
        };
        renderParticipant();
      }

      function fillForm(config) {
        $('adminTitle').value = config.title;
        $('adminStart').value = config.start;
        $('adminRelease').value = config.release;
        $('adminLink').value = config.link;
        $('adminApple').value = config.apple || '';
        $('adminSpotify').value = config.spotify || '';
        $('adminLine').value = config.line || '';
        $('adminYoutube').value = config.youtube || '';
        $('adminTemplate').value = config.template || 'hotel';
        $('adminStamp').value = config.stamp;
        selectedColor = config.color;
        [...$('colorList').children].forEach((item, index) => item.classList.toggle('selected', COLORS[index] === config.color));
      }

      function setupTestPanel(config) {
        if (!isTestMode) return;
        const panel = $('testPanel');
        const days = dateRange(config.start, config.release);
        if (!days.includes(simulatedToday)) simulatedToday = days[Math.floor((days.length - 1) / 2)];
        panel.classList.remove('hidden');
        $('testDate').min = config.start;
        $('testDate').max = config.release;
        $('testDate').value = simulatedToday;
        const effectLabels = { 3: '（演出1）', 5: '（演出2）', 10: '（演出3）', 15: '（演出4）', 20: '（演出4）' };
        $('testCount').innerHTML = days.map((_, index) => `<option value="${index}">${index}${effectLabels[index] || ''}</option>`).join('')
          + `<option value="${days.length}">${days.length}（全日）</option>`;
        $('testTemplate').value = config.template;

        if (panel.dataset.ready === '1') return;
        panel.dataset.ready = '1';
        $('testDate').addEventListener('change', () => {
          simulatedToday = $('testDate').value;
          renderParticipant();
        });
        $('testCount').addEventListener('change', () => {
          const campaignDays = dateRange(currentConfig.start, currentConfig.release);
          const previous = loadStamps(currentConfig).size;
          const count = Math.max(0, Math.min(campaignDays.length, Number($('testCount').value) || 0));
          saveStamps(currentConfig, new Set(campaignDays.slice(0, count)));
          renderParticipant();
          if (count > previous && [3, 5, 10, 15, 20, campaignDays.length].includes(count)) launchConfetti();
        });
        $('testTemplate').addEventListener('change', () => {
          currentConfig = { ...currentConfig, template: $('testTemplate').value };
          showParticipant(currentConfig);
        });
        $('testReset').addEventListener('click', () => {
          localStorage.removeItem(storageKey(currentConfig));
          localStorage.removeItem(metaKey(currentConfig));
          const campaignDays = dateRange(currentConfig.start, currentConfig.release);
          simulatedToday = campaignDays[Math.floor((campaignDays.length - 1) / 2)];
          renderParticipant();
          toast('テスト状態をリセットしました');
        });
      }

      function renderListenLinks(config) {
        const links = [
          ['まとめて選ぶ', config.link],
          ['Apple Music', config.apple],
          ['Spotify', config.spotify],
          ['LINE MUSIC', config.line],
          ['YouTube', config.youtube]
        ].filter((item) => item[1]);
        const wrap = $('listenLinks');
        wrap.innerHTML = '';
        wrap.classList.toggle('hidden', links.length === 0);
        links.forEach(([label, href], index) => {
          const link = document.createElement('a');
          link.className = `btn ${index === 0 ? 'btn-primary' : 'btn-soft'}`;
          link.href = href;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = `▶ ${label}`;
          wrap.appendChild(link);
        });
      }

      function renderParticipant() {
        const config = currentConfig;
        const days = dateRange(config.start, config.release);
        const today = currentDay();
        const meta = loadMeta(config);
        const stamps = loadStamps(config);
        const validStamps = new Set([...stamps].filter((day) => days.includes(day)));
        if (validStamps.size !== stamps.size) saveStamps(config, validStamps);

        const templateLabels = {
          hotel: 'HOTEL LISTENING CHECK-IN',
          classic: 'DAILY LISTENING STAMP',
          journey: 'RELEASE DAY JOURNEY'
        };
        $('templateLabel').textContent = templateLabels[config.template] || templateLabels.classic;
        $('campaignTitle').textContent = config.title;
        $('releaseDateText').textContent = formatDate(config.release);
        $('periodText').textContent = `${formatDate(config.start, false)} — ${formatDate(config.release, false)}`;
        renderListenLinks(config);

        const count = validStamps.size;
        if (isTestMode) {
          $('testDate').value = simulatedToday;
          $('testCount').value = String(count);
          $('testTemplate').value = config.template;
        }
        const milestone = milestoneState(count, days.length);
        const daysLeft = Math.max(0, Math.round((parseLocalDate(config.release) - parseLocalDate(today)) / 86400000));
        $('participantView').dataset.stage = String(milestone.stage);
        $('progressCount').textContent = `${count} STAMP${count === 1 ? '' : 'S'}`;
        $('daysLeftText').textContent = today > config.release ? 'イベント終了' : today === config.release ? '今日は発売日！' : `発売日まであと${daysLeft}日`;
        $('progressBar').style.width = `${milestone.progress}%`;
        const progressTrack = document.querySelector('.progress-track');
        progressTrack.setAttribute('aria-valuenow', String(milestone.progress));
        $('milestoneNote').textContent = count >= days.length ? '全日達成！' : `次の変化まであと${milestone.next - count}個`;

        const perfect = count === days.length && days.length > 0;
        const eventFinished = today >= config.release;
        $('completion').classList.toggle('show', perfect || eventFinished);
        $('completion').innerHTML = perfect
          ? `PERFECT！<br>発売日まで毎日ありがとう ${config.stamp}✨`
          : eventFinished ? `RELEASE DAY！<br>${count}日間の参加、ありがとう ${config.stamp}` : '';

        const canStampToday = days.includes(today);
        const todayStamped = validStamps.has(today);
        $('todayButton').disabled = !canStampToday;
        $('todayButton').textContent = todayStamped ? '今日のスタンプを外す' : '聴いたのでスタンプを押す';
        $('todayButton').onclick = () => toggleToday(config);

        if (today < config.start) $('helperText').textContent = `${formatDate(config.start)}からスタートします。未来の日付にはまだスタンプを押せません。`;
        else if (today > config.release) $('helperText').textContent = 'イベントは終了しました。集めたスタンプはこの端末に残ります。';
        else $('helperText').textContent = '今日聴いたら今日のマスへ。空いた日があっても、また今日から続けられます。';

        const grid = $('stampGrid');
        grid.innerHTML = '';
        days.forEach((day) => {
          const date = parseLocalDate(day);
          const isToday = day === today;
          const isStamped = validStamps.has(day);
          const isFuture = day > today;
          const isPrejoin = day < today && !isStamped;
          const element = document.createElement(isToday ? 'button' : 'div');
          if (isToday) element.type = 'button';
          element.className = `day${isToday ? ' today' : ''}${isStamped ? ' stamped' : ''}${isFuture ? ' future' : ''}${isPrejoin ? ' prejoin' : ''}`;
          const state = isPrejoin ? '参加前・開催済み' : isStamped ? 'スタンプ済み' : '未スタンプ';
          element.setAttribute('aria-label', `${formatDate(day)} ${state}${isToday ? ' 今日' : ''}`);
          if (isToday) element.addEventListener('click', () => toggleToday(config));
          element.innerHTML = `
            ${isToday ? '<span class="today-tag">TODAY</span>' : ''}
            <span class="day-date">${date.getMonth() + 1}/${date.getDate()}</span>
            <span class="day-week">${WEEKDAYS[date.getDay()]}</span>
            ${isPrejoin ? '<span class="day-state">開催済み</span>' : `<span class="day-stamp" aria-hidden="true">${config.stamp}</span>`}
          `;
          grid.appendChild(element);
        });

        $('xButton').onclick = () => shareToX(config);
        $('imageButton').onclick = openShareImage;
        $('imageButtonTop').onclick = openShareImage;
      }

      function toggleToday(config) {
        const today = currentDay();
        if (today < config.start || today > config.release) return;
        const stamps = loadStamps(config);
        const wasStamped = stamps.has(today);
        if (!isTestMode && !wasStamped && !window.confirm('今日、表題曲を聴きましたか？')) return;
        if (wasStamped) stamps.delete(today);
        else stamps.add(today);
        saveStamps(config, stamps);
        renderParticipant();
        if (!wasStamped) {
          const total = dateRange(config.start, config.release).length;
          toast(`${config.stamp} 今日のスタンプを押しました`);
          if ([3, 5, 10, 15, 20, total].includes(stamps.size)) launchConfetti();
        } else {
          toast('今日のスタンプを取り消しました');
        }
      }

      function launchConfetti() {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const colors = COLORS;
        for (let i = 0; i < 70; i += 1) {
          const piece = document.createElement('i');
          piece.className = 'confetti-piece';
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.setProperty('--c', colors[i % colors.length]);
          piece.style.setProperty('--d', `${2.1 + Math.random() * 2.2}s`);
          piece.style.setProperty('--r', `${Math.random() * 180}deg`);
          piece.style.setProperty('--x', `${-80 + Math.random() * 160}px`);
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4500);
        }
      }

      function buildCanvas(config) {
        const days = dateRange(config.start, config.release);
        const stamps = loadStamps(config);
        const cols = config.template === 'classic' ? 5 : 4;
        const rows = Math.ceil(days.length / cols);
        const width = 1080;
        const cardX = 38;
        const cardWidth = width - cardX * 2;
        const margin = 70;
        const gap = 16;
        const cell = Math.floor((width - margin * 2 - gap * (cols - 1)) / cols);
        const cellHeight = config.template === 'hotel' ? Math.round(cell * 1.14) : cell;
        const gridTop = 650;
        const gridHeight = rows * cellHeight + Math.max(0, rows - 1) * gap;
        const height = gridTop + gridHeight + 125;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const [r, g, b] = colorRgb(config.color);
        const themeText = contrastText(config.color);
        const isHotel = config.template === 'hotel';
        const isJourney = config.template === 'journey';
        const paper = isHotel ? '#fffaf0' : isJourney ? '#fffdf8' : '#ffffff';
        const sectionPaper = isHotel ? '#f7eedc' : paper;
        const ink = isHotel ? '#293b45' : '#24364a';
        const muted = isHotel ? '#7a6b58' : '#718096';
        const today = currentDay();

        ctx.fillStyle = '#eaf2f8';
        ctx.fillRect(0, 0, width, height);
        roundRect(ctx, cardX, 38, cardWidth, height - 76, 36);
        ctx.fillStyle = paper;
        ctx.fill();

        if (isHotel) {
          ctx.save();
          roundRect(ctx, cardX, 38, cardWidth, height - 76, 36);
          ctx.clip();
          const gradient = ctx.createLinearGradient(cardX, 38, cardX + cardWidth, 300);
          gradient.addColorStop(0, '#122a34');
          gradient.addColorStop(1, '#23444a');
          ctx.fillStyle = gradient;
          ctx.fillRect(cardX, 38, cardWidth, 255);
          ctx.restore();
        }

        ctx.fillStyle = config.color;
        roundRect(ctx, cardX, 38, cardWidth, 16, 8);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = isHotel ? '#f8e7bd' : config.color;
        ctx.font = '700 27px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(isHotel ? 'HOTEL LISTENING CHECK-IN' : isJourney ? 'RELEASE DAY JOURNEY' : 'DAILY LISTENING STAMP', width / 2, 105);
        ctx.fillStyle = isHotel ? '#fffaf0' : ink;
        ctx.font = '700 50px -apple-system, BlinkMacSystemFont, sans-serif';
        drawCenteredText(ctx, config.title, width / 2, 170, width - 190, 56);
        ctx.fillStyle = isHotel ? '#f8e7bd' : muted;
        ctx.font = '500 26px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(`${formatDate(config.release)} CD RELEASE`, width / 2, 235);

        const count = [...stamps].filter((day) => days.includes(day)).length;
        const milestone = milestoneState(count, days.length);
        const daysLeft = Math.max(0, Math.round((parseLocalDate(config.release) - parseLocalDate(today)) / 86400000));
        ctx.textAlign = 'left';
        ctx.fillStyle = ink;
        ctx.font = '700 39px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(`${count} STAMP${count === 1 ? '' : 'S'}`, margin, 350);
        ctx.textAlign = 'right';
        ctx.fillStyle = muted;
        ctx.font = '500 24px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(today > config.release ? 'イベント終了' : today === config.release ? '今日は発売日！' : `発売日まであと${daysLeft}日`, width - margin, 350);
        roundRect(ctx, margin, 378, width - margin * 2, 18, 9);
        ctx.fillStyle = '#e8eef3';
        ctx.fill();
        if (count) {
          roundRect(ctx, margin, 378, (width - margin * 2) * milestone.progress / 100, 18, 9);
          ctx.fillStyle = config.color;
          ctx.fill();
        }

        ctx.textAlign = 'right';
        ctx.fillStyle = muted;
        ctx.font = '500 22px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(count >= days.length ? '全日達成！' : `次の変化まであと${milestone.next - count}個`, width - margin, 440);

        const stageAlpha = [.22, .42, .62, .82, 1][milestone.stage] || .22;
        ctx.save();
        ctx.globalAlpha = stageAlpha;
        ctx.textAlign = 'center';
        ctx.fillStyle = config.color;
        ctx.font = '700 36px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('✦　✦　✦', width / 2, 510);
        ctx.restore();

        ctx.save();
        roundRect(ctx, cardX, 38, cardWidth, height - 76, 36);
        ctx.clip();
        ctx.fillStyle = sectionPaper;
        ctx.fillRect(cardX, 550, cardWidth, height - 588);
        ctx.restore();
        ctx.textAlign = 'left';
        ctx.fillStyle = ink;
        ctx.font = '700 34px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('LISTENING CARD', margin, 615);
        ctx.textAlign = 'right';
        ctx.fillStyle = muted;
        ctx.font = '500 24px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(`${formatDate(config.start, false)} — ${formatDate(config.release, false)}`, width - margin, 615);

        days.forEach((day, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          const x = margin + col * (cell + gap);
          const y = gridTop + row * (cellHeight + gap);
          const stamped = stamps.has(day);
          const prejoin = day < today && !stamped;
          const future = day > today;
          const isToday = day === today;
          const radius = isJourney ? cell / 2 : isHotel ? 16 : 23;
          roundRect(ctx, x, y, cell, cellHeight, radius);
          if (isHotel) ctx.fillStyle = stamped ? '#ffe6a3' : prejoin ? '#dfe3df' : future ? '#718183' : '#294852';
          else ctx.fillStyle = stamped ? config.color : prejoin ? '#e1e6e9' : isJourney ? '#fffdf8' : '#f5f8fa';
          if (stamped && isHotel) {
            ctx.save();
            ctx.shadowColor = 'rgba(255, 202, 92, .45)';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.restore();
          } else ctx.fill();
          if (isJourney && !stamped) ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, .3)`;
          else if (isToday) ctx.strokeStyle = config.color;
          else if (isHotel) ctx.strokeStyle = prejoin ? '#d2d7d3' : '#46646a';
          else ctx.strokeStyle = stamped ? config.color : '#dce7f0';
          ctx.lineWidth = isToday ? 6 : 2;
          ctx.stroke();

          const textColor = isHotel
            ? stamped ? '#2a3540' : prejoin ? '#8f9694' : '#e8dcc6'
            : stamped ? themeText : prejoin ? '#8d979e' : '#52677b';
          ctx.fillStyle = textColor;
          const date = parseLocalDate(day);
          ctx.textAlign = 'center';
          ctx.font = '700 24px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.fillText(`${date.getMonth() + 1}/${date.getDate()} （${WEEKDAYS[date.getDay()]}）`, x + cell / 2, y + 55);
          if (isToday) {
            ctx.fillStyle = stamped && isHotel ? '#2a3540' : config.color;
            ctx.font = '700 17px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillText('TODAY', x + cell / 2, y + 87);
            ctx.fillStyle = textColor;
          }
          if (stamped) {
            ctx.font = '58px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.fillText(config.stamp, x + cell / 2, y + cellHeight * .67);
          } else if (prejoin) {
            ctx.font = '700 19px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillText('開催済み', x + cell / 2, y + cellHeight * .64);
          } else {
            ctx.save();
            ctx.globalAlpha = .12;
            ctx.font = '48px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.fillText(config.stamp, x + cell / 2, y + cellHeight * .68);
            ctx.restore();
          }
        });

        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, .85)`;
        ctx.font = '700 22px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('ONE LISTEN A DAY, ALL THE WAY TO RELEASE DAY', width / 2, height - 75);
        return canvas;
      }

      function roundRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function drawCenteredText(ctx, text, x, y, maxWidth, lineHeight) {
        if (ctx.measureText(text).width <= maxWidth) {
          ctx.fillText(text, x, y);
          return;
        }
        const chars = [...text];
        let line = '';
        const lines = [];
        chars.forEach((char) => {
          const test = line + char;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = char;
          } else line = test;
        });
        if (line) lines.push(line);
        const startY = y - ((lines.length - 1) * lineHeight) / 2;
        lines.slice(0, 2).forEach((value, index) => ctx.fillText(value, x, startY + index * lineHeight));
      }

      function canvasBlob(canvas) {
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/png', 0.95));
      }

      async function openShareImage() {
        const canvas = buildCanvas(currentConfig);
        shareBlob = await canvasBlob(canvas);
        $('shareImage').src = URL.createObjectURL(shareBlob);
        $('shareModal').classList.add('show');
        $('shareModal').setAttribute('aria-hidden', 'false');
      }

      async function nativeShareImage() {
        if (!shareBlob) return;
        const file = new File([shareBlob], `daily-stamp-${currentConfig.id}.png`, { type: 'image/png' });
        const text = shareText(currentConfig);
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], text }); } catch (error) { if (error.name !== 'AbortError') toast('共有できませんでした'); }
        } else {
          saveImage();
          toast('画像を保存しました');
        }
      }

      function saveImage() {
        if (!shareBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(shareBlob);
        a.download = `daily-stamp-${currentConfig.id}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      function closeModal() {
        $('shareModal').classList.remove('show');
        $('shareModal').setAttribute('aria-hidden', 'true');
      }

      function shareText(config) {
        const days = dateRange(config.start, config.release);
        const count = [...loadStamps(config)].filter((day) => days.includes(day)).length;
        return `${config.stamp} ${config.title}\n発売日まで1日1回聴いています！\n【${count} STAMPS】\n#SnowMan`;
      }

      function shareToX(config) {
        const text = shareText(config);
        const url = configUrl(config);
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank', 'noopener');
      }

      function generate(mode = 'participant') {
        const config = configFromForm();
        if (!config) return;
        const testMode = mode === 'test';
        const url = configUrl(config, testMode);
        if (mode === 'preview') {
          history.replaceState(null, '', url);
          showParticipant(config);
          return;
        }
        $('generatedUrl').value = url;
        $('generatedUrlLabel').textContent = testMode ? '管理者用・テストURL' : '参加者へ共有するURL';
        $('urlBox').classList.add('show');
        $('generatedUrl').select();
        toast(testMode ? 'テスト用URLを作りました' : '参加者用URLを作りました');
      }

      async function copyGeneratedUrl() {
        const value = $('generatedUrl').value;
        try {
          await navigator.clipboard.writeText(value);
        } catch (_) {
          $('generatedUrl').select();
          document.execCommand('copy');
        }
        const copiedTestUrl = new URL(value).searchParams.get('test') === '1';
        toast(copiedTestUrl ? 'テスト用URLをコピーしました' : '参加者用URLをコピーしました');
      }

      function init() {
        renderColorChoices();
        initAdminDefaults();
        let config = configFromParams();
        if (isTestMode && !config) {
          config = {
            title: '動作確認用テストカード',
            start: '2026-10-01',
            release: '2026-10-14',
            stamp: '⛄️',
            color: '#4ea8de',
            link: '',
            apple: '',
            spotify: '',
            line: '',
            youtube: '',
            template: 'hotel',
            id: 'test-demo'
          };
        }
        currentConfig = config;
        const forceAdmin = params.get('admin') === '1';
        if (config && !forceAdmin) showParticipant(config);
        else showAdmin();
        if (isTestMode) requestAnimationFrame(() => window.scrollTo(0, 0));

        $('previewButton').addEventListener('click', () => generate('preview'));
        $('generateButton').addEventListener('click', () => generate('participant'));
        $('testGenerateButton').addEventListener('click', () => generate('test'));
        $('copyButton').addEventListener('click', copyGeneratedUrl);
        $('nativeShareButton').addEventListener('click', nativeShareImage);
        $('saveImageButton').addEventListener('click', saveImage);
        $('closeModalButton').addEventListener('click', closeModal);
        $('shareModal').addEventListener('click', (event) => { if (event.target === $('shareModal')) closeModal(); });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeModal(); });
      }

      init();
    })();
  </script>
</body>
</html>
