<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f1eb">
<title>DAILY LISTEN — TOUCH</title>
<style>
:root{--bg:#f4f1eb;--ink:#171717;--muted:#88847d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
body{touch-action:none}
#world{position:fixed;inset:0;overflow:hidden;background:
radial-gradient(circle at 72% 18%,rgba(255,255,255,.82),transparent 27%),
linear-gradient(155deg,#f8f6f1,#efebe3)}
#world:after{content:"";position:absolute;left:5vw;right:5vw;bottom:max(22px,env(safe-area-inset-bottom));height:1px;background:rgba(20,20,20,.23)}
header{position:fixed;z-index:20;left:20px;right:20px;top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:10px;font-weight:800;letter-spacing:.22em}.meta{text-align:right;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.13em;line-height:1.65}
#hint{position:fixed;z-index:18;left:50%;top:47%;transform:translate(-50%,-50%);width:80%;text-align:center;color:#77736d;pointer-events:none;transition:opacity .5s}
#hint strong{display:block;color:#272727;font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:400;letter-spacing:.025em;margin-bottom:9px}
#hint span{font-size:10px;letter-spacing:.13em}
.piece{position:absolute;z-index:4;display:grid;place-items:center;font-weight:700;line-height:1;user-select:none;-webkit-user-select:none;will-change:left,top,transform;pointer-events:none}
.piece.latest{filter:drop-shadow(0 0 11px rgba(255,255,255,.95)) drop-shadow(0 3px 7px rgba(0,0,0,.13))}
.ripple{position:absolute;z-index:2;border:1px solid rgba(25,25,25,.32);border-radius:50%;pointer-events:none;animation:ripple 1.05s cubic-bezier(.2,.65,.25,1) forwards}
@keyframes ripple{0%{opacity:.8;transform:translate(-50%,-50%) scale(.12)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}}
.flash{position:fixed;z-index:8;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(255,255,255,.9),rgba(255,255,255,0) 24%);animation:flash .65s ease-out forwards}
@keyframes flash{from{opacity:.8}to{opacity:0}}
.spark{position:absolute;z-index:7;width:3px;height:3px;border-radius:50%;background:currentColor;pointer-events:none;animation:spark .72s ease-out forwards}
@keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
#latestLabel{position:absolute;z-index:9;padding:4px 7px;border:1px solid rgba(20,20,20,.24);border-radius:999px;background:rgba(248,246,241,.8);backdrop-filter:blur(5px);font-size:7px;font-weight:900;letter-spacing:.16em;pointer-events:none;opacity:0;transition:opacity .25s}
#latestLabel.show{opacity:1}
#milestone{position:fixed;z-index:30;inset:0;display:none;place-items:center;pointer-events:none;background:rgba(244,241,235,.08)}
#milestone.show{display:grid;animation:milestoneFade 1.8s ease forwards}
#milestone div{text-align:center}
#milestone b{display:block;font:400 58px Georgia,serif;letter-spacing:.02em}
#milestone small{font-size:9px;font-weight:800;letter-spacing:.25em}
@keyframes milestoneFade{0%{opacity:0}16%,67%{opacity:1}100%{opacity:0}}
footer{position:fixed;z-index:20;left:20px;right:20px;bottom:max(17px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.count{font:400 12px Georgia,serif;letter-spacing:.08em}
.tools{display:flex;gap:8px;pointer-events:auto}
.tool{width:35px;height:35px;border:1px solid rgba(20,20,20,.18);border-radius:50%;background:rgba(248,246,241,.68);backdrop-filter:blur(8px);color:#555;font-size:14px}
#palette{position:fixed;z-index:25;left:50%;bottom:calc(max(58px,env(safe-area-inset-bottom) + 46px));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border:1px solid rgba(20,20,20,.13);border-radius:999px;background:rgba(248,246,241,.72);backdrop-filter:blur(12px);transition:opacity .3s,transform .3s}
#palette.hidden{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.sym{width:33px;height:33px;border:0;border-radius:50%;background:transparent;color:#555;font-size:17px}
.sym.on{background:#171717;color:#fff}
</style>
</head>
<body>
<div id="world">
<header><div class="brand">DAILY LISTEN</div><div class="meta"><span id="dayLabel">TOUCH / 01</span><br>ONE TOUCH · ONE LISTEN</div></header>
<div id="hint"><strong>touch anywhere</strong><span>今日のひとつを、ここに。</span></div>
<div id="latestLabel">LATEST</div>
</div>
<div id="palette"></div>
<footer><div id="count" class="count">0 objects</div><div class="tools"><button id="choose" class="tool" aria-label="記号を選ぶ">✦</button><button id="reset" class="tool" aria-label="リセット">↺</button></div></footer>
<div id="milestone"><div><b id="mileNum">3</b><small>LISTENS</small></div></div>
<script>
(()=>{'use strict';
const W=document.querySelector('#world'),H=document.querySelector('#hint'),COUNT=document.querySelector('#count'),PAL=document.querySelector('#palette'),CH=document.querySelector('#choose'),LAB=document.querySelector('#latestLabel');
const SYMBOLS=['♪','✦','●','◆','★','♡','S','M','9'];
const COLORS=['#171717','#3f7167','#b84743','#c99431','#574e88','#d36697','#3d779b','#c76831'];
const KEY='daily_listen_touch_v3';
let selected='✦', pieces=[], busy=false, audio=null;
try{pieces=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(pieces))pieces=[]}catch(e){pieces=[]}
const dims=()=>({w:innerWidth,h:innerHeight,floor:innerHeight-Math.max(24,parseFloat(getComputedStyle(document.documentElement).fontSize)||16)-25});
const radius=p=>p.size*.39;
const save=()=>localStorage.setItem(KEY,JSON.stringify(pieces));
function tone(freq=300,dur=.12,vol=.035,type='sine'){
 try{audio=audio||new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}
}
function render(latest=-1){
 W.querySelectorAll('.piece').forEach(e=>e.remove());let{w,h}=dims();
 pieces.forEach((p,i)=>{let e=document.createElement('div');e.className='piece'+(i===latest?' latest':'');e.textContent=p.symbol;e.style.width=e.style.height=p.size+'px';e.style.fontSize=p.size*.78+'px';e.style.color=p.color;e.style.left=p.x*w-p.size/2+'px';e.style.top=p.y*h-p.size/2+'px';e.style.transform=`rotate(${p.angle}rad)`;W.append(e)});
 COUNT.textContent=`${pieces.length} object${pieces.length===1?'':'s'}`;H.style.opacity=pieces.length?'0':'1';document.querySelector('#dayLabel').textContent=`TOUCH / ${String(pieces.length+1).padStart(2,'0')}`;
}
SYMBOLS.forEach(s=>{let b=document.createElement('button');b.className='sym'+(s===selected?' on':'');b.textContent=s;b.onclick=e=>{e.stopPropagation();selected=s;CH.textContent=s;[...PAL.children].forEach(x=>x.classList.toggle('on',x===b));PAL.classList.add('hidden')};PAL.append(b)});
CH.onclick=e=>{e.stopPropagation();PAL.classList.toggle('hidden')};
document.querySelector('#reset').onclick=e=>{e.stopPropagation();if(confirm('この作品をリセットしますか？')){pieces=[];save();LAB.classList.remove('show');render()}};
function ripple(x,y){let r=document.createElement('i');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';r.style.width=r.style.height='60px';W.append(r);setTimeout(()=>r.remove(),1100);let f=document.createElement('i');f.className='flash';f.style.setProperty('--x',x+'px');f.style.setProperty('--y',y+'px');document.body.append(f);setTimeout(()=>f.remove(),700)}
function sparks(x,y,color){for(let i=0;i<12;i++){let s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.color=color;let a=Math.PI*2*i/12,d=18+Math.random()*30;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');W.append(s);setTimeout(()=>s.remove(),760)}}
function resolve(B,w,floor){
 for(let pass=0;pass<8;pass++)for(let i=0;i<B.length;i++){let a=B[i],ra=radius(a);if(a.X<ra){a.X=ra;a.vx=Math.abs(a.vx)*.4}if(a.X>w-ra){a.X=w-ra;a.vx=-Math.abs(a.vx)*.4}if(a.Y>floor-ra){a.Y=floor-ra;a.vy*=-.12;a.vx*=.72;a.av*=.7}
 for(let j=i+1;j<B.length;j++){let b=B[j],rb=radius(b),dx=b.X-a.X,dy=b.Y-a.Y,d=Math.hypot(dx,dy)||.001,m=ra+rb;if(d<m){let nx=dx/d,ny=dy/d,o=m-d,ma=a.mass,mb=b.mass,t=ma+mb;a.X-=nx*o*(mb/t);a.Y-=ny*o*(mb/t);b.X+=nx*o*(ma/t);b.Y+=ny*o*(ma/t);let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let imp=-rv*.32;a.vx-=imp*nx*mb/t;a.vy-=imp*ny*mb/t;b.vx+=imp*nx*ma/t;b.vy+=imp*ny*ma/t;a.av-=nx*.005;b.av+=nx*.005}}}}
}
function celebrate(n){if(![3,5,10,15,20].includes(n))return;document.querySelector('#mileNum').textContent=n;let m=document.querySelector('#milestone');m.classList.remove('show');void m.offsetWidth;m.classList.add('show');setTimeout(()=>m.classList.remove('show'),1850);tone(520+n*9,.35,.025,'sine')}
async function dropAt(x,y){
 if(busy)return;busy=true;PAL.classList.add('hidden');ripple(x,y);tone(180+x/innerWidth*380,.10,.03,'sine');
 let{w,h,floor}=dims(),B=pieces.map(p=>({...p,X:p.x*w,Y:p.y*h,vx:0,vy:0,av:0,mass:1.55}));
 let size=44+Math.random()*17, color=COLORS[Math.floor(Math.random()*COLORS.length)];
 let n={symbol:selected,color,size,angle:(Math.random()-.5)*.22,X:Math.max(size/2,Math.min(w-size/2,x)),Y:Math.max(75,Math.min(y,innerHeight*.38)),vx:(Math.random()-.5)*1.1,vy:0,av:(Math.random()-.5)*.045,mass:.9};
 B.push(n);let last=performance.now(),quiet=0,hit=false;
 function frame(now){let dt=Math.min(1.7,(now-last)/16.67);last=now;B.forEach(p=>{p.vy+=.36*dt;p.X+=p.vx*dt;p.Y+=p.vy*dt;p.angle+=p.av*dt;p.vx*=.994;p.av*=.992});let before=n.vy;resolve(B,w,floor);if(!hit&&before>2.2&&n.vy<before*.5){hit=true;tone(105+n.X/w*120,.16,.045,'triangle');sparks(n.X,n.Y,n.color)}
 let energy=B.reduce((s,p)=>s+Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(p.av)*15,0);quiet=energy<1.1?quiet+1:0;
 pieces=B.map(p=>({symbol:p.symbol,color:p.color,size:p.size,angle:p.angle,x:p.X/w,y:p.Y/h}));render(pieces.length-1);
 if(quiet>18){save();let q=pieces.at(-1);LAB.style.left=q.x*w+18+'px';LAB.style.top=q.y*h-q.size*.55+'px';LAB.classList.add('show');setTimeout(()=>LAB.classList.remove('show'),2600);celebrate(pieces.length);busy=false;return}requestAnimationFrame(frame)}
 requestAnimationFrame(frame)
}
W.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dropAt(e.clientX,e.clientY)});
addEventListener('resize',()=>render());render();
})();
</script></body></html>
